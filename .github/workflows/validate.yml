name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scripts
        run: >-
          python -m py_compile
          build-evidence-travel-guide/scripts/init_project.py
          build-evidence-travel-guide/scripts/audit_evidence.py
          build-evidence-travel-guide/scripts/doctor.py
          build-evidence-travel-guide/scripts/validate_pdf.py
          build-evidence-travel-guide/scripts/render_pdf.py

      - name: Run tests
        run: python -m unittest discover -s build-evidence-travel-guide/tests -v
